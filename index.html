<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veilige opslagdemo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#eef3f7;display:flex;align-items:center;justify-content:center;color:#35424a}
.card{width:400px;background:#fff;border-radius:7px;box-shadow:0 8px 30px #0002;padding:36px}
.demo{display:inline-block;background:#fff3cd;color:#795b00;border-radius:20px;padding:5px 10px;font-size:11px;font-weight:bold;margin-bottom:20px}
h1{font-size:24px;font-weight:400;margin:0 0 8px}
.info{font-size:13px;color:#74818a;line-height:1.5;margin-bottom:22px}
label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}
input{width:100%;height:44px;border:1px solid #cbd4da;border-radius:4px;padding:0 12px;font-size:15px}
button{width:100%;height:45px;margin-top:20px;border:0;border-radius:4px;background:#1680bd;color:#fff;font-weight:bold;cursor:pointer}
.secondary{background:#68757d;margin-top:10px}
#result{margin-top:18px;padding:12px;border-radius:4px;background:#eef7fc;font-size:13px;display:none}
.records{margin-top:22px;border-top:1px solid #ddd;padding-top:18px;display:none}
.record{padding:9px;background:#f5f7f8;border-radius:4px;margin-top:8px;font-size:12px}
</style>
</head>
<body>
<main class="card">
<div class="demo">VEILIGE SCHOOLDEMO</div>
<h1>Lokale opslagdemo</h1>
<div class="info">
Deze demo slaat uitsluitend expliciete <b>nepgegevens</b> lokaal in deze browser op.
Gebruik alleen <b>TESTUSER</b> en een wachtwoord dat begint met <b>DEMO-</b>.
</div>

<form id="form">
<label for="username">Demo-gebruikersnaam</label>
<input id="username" autocomplete="off" placeholder="TESTUSER">

<label for="password">Demo-wachtwoord</label>
<input id="password" type="password" autocomplete="off" placeholder="DEMO-12345">

<button type="submit">Demo opslaan</button>
</form>

<div id="result"></div>

<button class="secondary" id="show">Opgeslagen demo's bekijken</button>
<div class="records" id="records"></div>
</main>

<script>
const form=document.getElementById("form");
const result=document.getElementById("result");
const records=document.getElementById("records");

form.addEventListener("submit",function(e){
  e.preventDefault();

  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  // Veiligheidsbeperking: alleen vaste nepgegevens worden opgeslagen.
  if(username!=="TESTUSER" || !password.startsWith("DEMO-")){
    result.textContent="Afgewezen. Gebruik TESTUSER en bijvoorbeeld DEMO-12345.";
    result.style.display="block";
    return;
  }

  const saved=JSON.parse(localStorage.getItem("securityDemo") || "[]");
  saved.push({
    username: username,
    password: password,
    time: new Date().toLocaleString("nl-NL")
  });
  localStorage.setItem("securityDemo",JSON.stringify(saved));

  result.textContent="Opgeslagen! De demo-gegevens staan alleen lokaal in deze browser.";
  result.style.display="block";
  form.reset();
});

document.getElementById("show").addEventListener("click",function(){
  const saved=JSON.parse(localStorage.getItem("securityDemo") || "[]");
  records.style.display="block";

  if(!saved.length){
    records.innerHTML="<div class='record'>Nog geen demo-gegevens opgeslagen.</div>";
    return;
  }

  records.innerHTML=saved.map((x,i)=>
    "<div class='record'><b>Demo "+(i+1)+"</b><br>Gebruiker: "+
    escapeHtml(x.username)+"<br>Wachtwoord: "+
    escapeHtml(x.password)+"<br>Tijd: "+escapeHtml(x.time)+"</div>"
  ).join("");
});

function escapeHtml(value){
  return value.replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}
</script>
</body>
</html>
